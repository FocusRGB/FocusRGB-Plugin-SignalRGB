# Weekly dependency updates into develop. Branches are named dependabot/*, which branch-policy allows.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Moves to nuget.org 1.0 by hand (FocusRGB#84); the legacy feed needs credentials Dependabot doesn't have.
      - dependency-name: FocusRgb.PluginSdk
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
