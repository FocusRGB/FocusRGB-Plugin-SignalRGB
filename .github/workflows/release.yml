name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/FocusRgb.Plugin.SignalRgb/**
      - LICENSE

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PACKAGE_SUFFIX: ${{ github.event_name == 'push' && github.ref_name || format('dry-run-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRGB-Plugin-SignalRGB.slnx
      - run: dotnet test --solution FocusRGB-Plugin-SignalRGB.slnx -c Release
      - name: Assemble package
        shell: pwsh
        run: |
          dotnet publish src/FocusRgb.Plugin.SignalRgb/FocusRgb.Plugin.SignalRgb.csproj -c Release --no-restore --no-self-contained -o build/package/signalrgb
          Copy-Item src/FocusRgb.Plugin.SignalRgb/focusrgb-plugin.json build/package/signalrgb/
          Copy-Item LICENSE build/package/signalrgb/
          $zip = "build/FocusRGB-Plugin-SignalRGB-${{ env.PACKAGE_SUFFIX }}.zip"
          $manifest = "build/focusrgb-plugin.json"
          Compress-Archive build/package/signalrgb/* $zip
          Copy-Item src/FocusRgb.Plugin.SignalRgb/focusrgb-plugin.json $manifest
          @($zip, $manifest) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content build/SHA256SUMS -Encoding utf8NoBOM
          if ((Get-Content build/SHA256SUMS).Count -ne 2) {
            throw "SHA256SUMS must contain the package and manifest hashes."
          }
      - name: Upload dry-run release assets
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: FocusRGB-Plugin-SignalRGB-${{ env.PACKAGE_SUFFIX }}
          path: |
            build/FocusRGB-Plugin-SignalRGB-${{ env.PACKAGE_SUFFIX }}.zip
            build/focusrgb-plugin.json
            build/SHA256SUMS
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            build/FocusRGB-Plugin-SignalRGB-${{ env.PACKAGE_SUFFIX }}.zip
            build/focusrgb-plugin.json
            build/SHA256SUMS
          generate_release_notes: true
