name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRGB-Plugin-SignalRGB.slnx
      - run: dotnet build FocusRGB-Plugin-SignalRGB.slnx -c Release --no-restore
      - run: dotnet test --solution FocusRGB-Plugin-SignalRGB.slnx -c Release --no-build
